[workspace]
resolver = "2"
members = ["crates/herald-core", "crates/herald-server", "crates/herald-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/diprish/herald"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false }
# No `getrandom` on any of these: herald-core takes entropy as a parameter so it
# stays buildable for wasm32-unknown-unknown without a JavaScript shim.
x25519-dalek = { version = "2", default-features = false, features = ["alloc", "precomputed-tables", "zeroize", "static_secrets"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hkdf = { version = "0.12", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
